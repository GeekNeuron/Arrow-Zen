 #settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start}#settings .row.col{justify-content:space-between}#settings .sws{justify-content:flex-start}#settings>.hd,#settings>.note{grid-column:1/-1}.row{padding:18px 20px}
 /* game: side panel + large board */
 #game{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:1fr auto auto auto auto 1fr}
 #bar{display:contents;direction:inherit}
 #mid{grid-column:1;grid-row:2;margin:0 26px;background:var(--card);border-radius:22px;padding:20px 16px;gap:10px}#diff{font-size:20px}#lives{gap:6px}#lives .hrt{width:40px;height:40px}.tm{font-size:38px}
 #track{grid-column:1;grid-row:3;margin:18px 26px 0;height:12px;border-radius:6px;overflow:hidden}#prog{border-radius:6px}
 #bar #hintBtn{grid-column:1;grid-row:4;margin:20px 26px 0;justify-self:stretch;display:flex;align-items:center;justify-content:flex-start;gap:12px;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:600}
 #hintBtn .bdg2{margin-inline-start:auto;order:2}#hintBtn .kb{order:3;margin-inline-start:8px}
 #bar .l{grid-column:1;grid-row:5;justify-self:stretch;margin:12px 26px 0;display:flex;flex-direction:column;gap:10px}
 #bar .l .cb{width:100%;height:auto;border-radius:16px;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:14px 18px;font-size:15px;font-weight:600}#bar .l .cb:after{content:attr(aria-label);order:1}#bar .l .cb .kb{order:2}
 .kb{display:inline-block;font-family:inherit;font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;background:color-mix(in srgb,var(--fg) 13%,transparent);color:var(--btnfg);margin-inline-start:auto}
 #wrap{grid-column:2;grid-row:1/-1;padding:30px 30px 30px 6px}html[dir=rtl] #wrap{padding:30px 6px 30px 30px}
 #area{--reserve:76px;background:color-mix(in srgb,var(--card) 62%,var(--bg));border-radius:28px}
 .fab{width:auto;height:46px;border-radius:23px;padding:0 18px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;bottom:15px}.fab:after{content:attr(aria-label);order:1}.fab .kb{order:2;margin-inline-start:4px}.fab .bdg{position:static;order:3}
 #resetBtn{left:16px}#guideBtn{right:16px}
 .toast{bottom:36px}
}
@media(min-width:860px) and (max-width:1139px) and (min-height:520px){
 #app{grid-template-columns:200px minmax(0,1fr)}#nav button{font-size:14.5px;padding:12px}
 .page{padding:30px 32px 44px}.cols,#custom .cols{grid-template-columns:minmax(0,1fr);row-gap:22px}
 .home{grid-template-columns:minmax(0,1fr);grid-template-areas:"chip" "brand" "cards" "modes" "play";justify-items:stretch;gap:22px}
 .home .brand{align-self:start;align-items:center;text-align:center}.home .chip{justify-self:center}#playBtn{max-width:none}
 #settings{grid-template-columns:minmax(0,1fr)}#game{grid-template-columns:260px minmax(0,1fr)}#cal{margin-inline:auto}
}
</style></head><body>
